[package]
name = "codex-gauge"
version = "0.1.0"
description = "Codex account and usage dashboard"
authors = ["rfw"]
edition = "2021"

[lib]
name = "codex_gauge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
atomic-write-file = "0.3.1"
notify = "8.2"
sysinfo = "0.38.4"
tauri-plugin-prevent-default = { version = "5", features = ["platform-windows"] }

[target.'cfg(windows)'.dependencies]
windows-dpapi = "0.2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
